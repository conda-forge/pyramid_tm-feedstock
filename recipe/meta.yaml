{% set name = "pyramid_tm" %}
{% set version = "2.7" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: b1fa1603885f056fba28b21060f639c16a7f932a4a005a3443b6419f423b0479

build:
  noarch: python
  number: 0
  script: {{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python {{ python_min }}
    - setuptools
    - pip
  run:
    - python >={{ python_min }}
    - pyramid >=1.5
    - transaction >=2.0

test:
  imports:
    - pyramid_tm

about:
  home: https://docs.pylonsproject.org/projects/pyramid_tm
  license: LicenseRef-Pylons
  license_family: BSD
  license_file: LICENSE.txt
  summary: Pyramid requests joining the Python transaction package
  description: |
    pyramid_tm is a package which allows Pyramid requests to join the
    active transaction as provided by the Python transaction package.
  doc_url: https://docs.pylonsproject.org/projects/pyramid_tm/
  dev_url: https://github.com/Pylons/pyramid_tm

extra:
  recipe-maintainers:
    - ChrisBarker-NOAA
    - JamesMakela-NOAA
